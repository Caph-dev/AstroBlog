<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1290" viewBox="0 0 1600 1290">
  <defs>
    <style>
      .sans { font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", "Microsoft YaHei", sans-serif; }
      .num { font-family: "SF Mono", "Menlo", "Consolas", monospace; }
    </style>
  </defs>

  <rect width="1600" height="1290" fill="#fbfaf9"/>

  <!-- Header -->
  <text class="sans" x="72" y="82" font-size="42" font-weight="700" fill="#1a1a1a">渐进式披露 skill 的四个阶段</text>
  <text class="sans" x="72" y="124" font-size="22" fill="#8a857f">七个提交 · 产品文件只有两份 Markdown 和一份七行配置</text>
  <line x1="72" y1="146" x2="1528" y2="146" stroke="#e8e4df" stroke-width="2"/>

  <!-- Stage 1 -->
  <rect x="72" y="170" width="1456" height="224" rx="16" fill="#ffffff" stroke="#e8e4df" stroke-width="2"/>
  <rect x="72" y="170" width="6" height="224" rx="3" fill="#6b8e9f"/>
  <circle cx="146" cy="228" r="26" fill="#6b8e9f"/>
  <text class="num" x="146" y="238" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text class="sans" x="200" y="240" font-size="30" font-weight="700" fill="#1a1a1a">把重构写成一条固定流程</text>
  <circle cx="208" cy="278" r="4" fill="#b8b2ab"/>
  <text class="sans" x="228" y="287" font-size="24" fill="#4a4a4a">流程是一条直线：识别文件、检查结构、分两桶、设计 docs 映射、重写入口、验证</text>
  <circle cx="208" cy="316" r="4" fill="#b8b2ab"/>
  <text class="sans" x="228" y="325" font-size="24" fill="#4a4a4a">规则只分「放进入口」和「下沉到 docs」两桶，分类标准是主题</text>
  <circle cx="208" cy="354" r="4" fill="#b8b2ab"/>
  <text class="sans" x="228" y="363" font-size="24" fill="#4a4a4a">文档名、验证命令和规则主题都取自作者当时那一个项目</text>

  <!-- Stage 2 -->
  <rect x="72" y="414" width="1456" height="224" rx="16" fill="#ffffff" stroke="#e8e4df" stroke-width="2"/>
  <rect x="72" y="414" width="6" height="224" rx="3" fill="#7a9a6b"/>
  <circle cx="146" cy="472" r="26" fill="#7a9a6b"/>
  <text class="num" x="146" y="482" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text class="sans" x="200" y="484" font-size="30" font-weight="700" fill="#1a1a1a">矛盾检测移到分类之前</text>
  <circle cx="208" cy="522" r="4" fill="#b8b2ab"/>
  <text class="sans" x="228" y="531" font-size="24" fill="#4a4a4a">新增一步「先检测矛盾」，后续步骤编号整体后移</text>
  <circle cx="208" cy="560" r="4" fill="#b8b2ab"/>
  <text class="sans" x="228" y="569" font-size="24" fill="#4a4a4a">文档名换成占位符，验证命令改为按当前环境适配</text>
  <circle cx="208" cy="598" r="4" fill="#b8b2ab"/>
  <text class="sans" x="228" y="607" font-size="24" fill="#4a4a4a">规则本身冲突时，先分类会把冲突分散到不同文档</text>

  <!-- Stage 3 -->
  <rect x="72" y="658" width="1456" height="224" rx="16" fill="#ffffff" stroke="#e8e4df" stroke-width="2"/>
  <rect x="72" y="658" width="6" height="224" rx="3" fill="#b08a4f"/>
  <circle cx="146" cy="716" r="26" fill="#b08a4f"/>
  <text class="num" x="146" y="726" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text class="sans" x="200" y="728" font-size="30" font-weight="700" fill="#1a1a1a">用删减表达适用边界</text>
  <circle cx="208" cy="766" r="4" fill="#b8b2ab"/>
  <text class="sans" x="228" y="775" font-size="24" fill="#4a4a4a">README 重写为中文优先，改动方式以删为主</text>
  <circle cx="208" cy="804" r="4" fill="#b8b2ab"/>
  <text class="sans" x="228" y="813" font-size="24" fill="#4a4a4a">用警示块写出「全局拆分主要是方便维护」这条反面结论</text>
  <circle cx="208" cy="842" r="4" fill="#b8b2ab"/>
  <text class="sans" x="228" y="851" font-size="24" fill="#4a4a4a">同时删掉安装选项和手动安装等冗长段落</text>

  <!-- Stage 4 -->
  <rect x="72" y="902" width="1456" height="224" rx="16" fill="#ffffff" stroke="#e8e4df" stroke-width="2"/>
  <rect x="72" y="902" width="6" height="224" rx="3" fill="#9a6b8e"/>
  <circle cx="146" cy="960" r="26" fill="#9a6b8e"/>
  <text class="num" x="146" y="970" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text class="sans" x="200" y="972" font-size="30" font-weight="700" fill="#1a1a1a">拆分不再是默认动作</text>
  <circle cx="208" cy="1010" r="4" fill="#b8b2ab"/>
  <text class="sans" x="228" y="1019" font-size="24" fill="#4a4a4a">目标改为在不动、原地整理或拆分中取最小的有效改动</text>
  <circle cx="208" cy="1048" r="4" fill="#b8b2ab"/>
  <text class="sans" x="228" y="1057" font-size="24" fill="#4a4a4a">前提是用户没有明确要求拆分，分类改看使用频率与漏读后果</text>
  <circle cx="208" cy="1086" r="4" fill="#b8b2ab"/>
  <text class="sans" x="228" y="1095" font-size="24" fill="#4a4a4a">验证在关键词检查之外，增加力度、时机和例外的比对</text>

  <!-- Footer -->
  <rect x="72" y="1154" width="1456" height="76" rx="14" fill="#f2efeb"/>
  <text class="sans" x="112" y="1202" font-size="23" fill="#5a5550">改动集中在判断顺序和判断标准上，产品文件里没有新增命令、依赖或服务。</text>
</svg>
