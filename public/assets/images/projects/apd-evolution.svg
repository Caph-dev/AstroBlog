<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260">
  <defs>
    <style>
      .sans { font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: "SF Mono", "Menlo", "Consolas", monospace; }
    </style>
  </defs>

  <rect width="1600" height="1260" fill="#fbfaf9"/>

  <!-- Header -->
  <text class="sans" x="72" y="82" font-size="42" font-weight="700" fill="#1a1a1a">渐进式披露 skill 的四个阶段</text>
  <text class="sans" x="72" y="124" font-size="22" fill="#8a857f">7 个提交 · 产品文件只有两份 Markdown 和一份 7 行配置</text>
  <line x1="72" y1="146" x2="1528" y2="146" stroke="#e8e4df" stroke-width="2"/>

  <!-- Stage 1 -->
  <rect x="72" y="170" width="1456" height="210" rx="16" fill="#ffffff" stroke="#e8e4df" stroke-width="2"/>
  <rect x="72" y="170" width="6" height="210" rx="3" fill="#6b8e9f"/>
  <text class="sans" x="112" y="228" font-size="19" font-weight="700" fill="#6b8e9f">阶段 1 · 写成流程</text>
  <text class="mono" x="112" y="268" font-size="18" fill="#8a857f">490a61d</text>
  <text class="mono" x="112" y="298" font-size="18" fill="#8a857f">cf60de8 · 2f9fe11</text>
  <text class="sans" x="400" y="228" font-size="30" font-weight="700" fill="#1a1a1a">把重构写成一条固定流程</text>
  <circle cx="408" cy="272" r="4" fill="#b8b2ab"/>
  <text class="sans" x="428" y="281" font-size="24" fill="#4a4a4a">361 行一次落地：README 241、SKILL 113、配置 7</text>
  <circle cx="408" cy="314" r="4" fill="#b8b2ab"/>
  <text class="sans" x="428" y="323" font-size="24" fill="#4a4a4a">六步线性流程，规则只分「放进入口」和「下沉到 docs」两桶</text>
  <circle cx="408" cy="356" r="4" fill="#b8b2ab"/>
  <text class="sans" x="428" y="365" font-size="24" fill="#4a4a4a">文档名与验证命令直接按 macOS、zsh 和具体文件名硬编码</text>

  <!-- Stage 2 -->
  <rect x="72" y="404" width="1456" height="210" rx="16" fill="#ffffff" stroke="#e8e4df" stroke-width="2"/>
  <rect x="72" y="404" width="6" height="210" rx="3" fill="#7a9a6b"/>
  <text class="sans" x="112" y="462" font-size="19" font-weight="700" fill="#7a9a6b">阶段 2 · 去具体化</text>
  <text class="mono" x="112" y="502" font-size="18" fill="#8a857f">faae6fa</text>
  <text class="mono" x="112" y="532" font-size="18" fill="#8a857f">SKILL +27/−22</text>
  <text class="sans" x="400" y="462" font-size="30" font-weight="700" fill="#1a1a1a">矛盾检测移到分类之前</text>
  <circle cx="408" cy="506" r="4" fill="#b8b2ab"/>
  <text class="sans" x="428" y="515" font-size="24" fill="#4a4a4a">插入独立的「先检测矛盾」步骤，后续步骤编号整体后移</text>
  <circle cx="408" cy="548" r="4" fill="#b8b2ab"/>
  <text class="sans" x="428" y="557" font-size="24" fill="#4a4a4a">docs 名换成 [rule cluster] 占位符，验证命令改为按环境适配</text>
  <circle cx="408" cy="590" r="4" fill="#b8b2ab"/>
  <text class="sans" x="428" y="599" font-size="24" fill="#4a4a4a">规则本身冲突时，先分类会把冲突分散到不同文档</text>

  <!-- Stage 3 -->
  <rect x="72" y="638" width="1456" height="210" rx="16" fill="#ffffff" stroke="#e8e4df" stroke-width="2"/>
  <rect x="72" y="638" width="6" height="210" rx="3" fill="#b08a4f"/>
  <text class="sans" x="112" y="696" font-size="19" font-weight="700" fill="#b08a4f">阶段 3 · 写明边界</text>
  <text class="mono" x="112" y="736" font-size="18" fill="#8a857f">88a0817</text>
  <text class="mono" x="112" y="766" font-size="18" fill="#8a857f">59c6974</text>
  <text class="sans" x="400" y="696" font-size="30" font-weight="700" fill="#1a1a1a">用删减，而不是新增，表达适用边界</text>
  <circle cx="408" cy="740" r="4" fill="#b8b2ab"/>
  <text class="sans" x="428" y="749" font-size="24" fill="#4a4a4a">README 两次净减 78 行，英文优先改为中文优先</text>
  <circle cx="408" cy="782" r="4" fill="#b8b2ab"/>
  <text class="sans" x="428" y="791" font-size="24" fill="#4a4a4a">用警示块把「全局拆分主要是方便维护」提到显眼位置</text>
  <circle cx="408" cy="824" r="4" fill="#b8b2ab"/>
  <text class="sans" x="428" y="833" font-size="24" fill="#4a4a4a">同时删掉安装选项、手动安装等冗长段落</text>

  <!-- Stage 4 -->
  <rect x="72" y="872" width="1456" height="210" rx="16" fill="#ffffff" stroke="#e8e4df" stroke-width="2"/>
  <rect x="72" y="872" width="6" height="210" rx="3" fill="#9a6b8e"/>
  <text class="sans" x="112" y="930" font-size="19" font-weight="700" fill="#9a6b8e">阶段 4 · 先判断</text>
  <text class="mono" x="112" y="970" font-size="18" fill="#8a857f">7ed178f</text>
  <text class="mono" x="112" y="1000" font-size="18" fill="#8a857f">SKILL +26/−16</text>
  <text class="sans" x="400" y="930" font-size="30" font-weight="700" fill="#1a1a1a">拆分不再是默认动作</text>
  <circle cx="408" cy="974" r="4" fill="#b8b2ab"/>
  <text class="sans" x="428" y="983" font-size="24" fill="#4a4a4a">目标改为在不动、原地整理或拆分中取最小有效改动</text>
  <circle cx="408" cy="1016" r="4" fill="#b8b2ab"/>
  <text class="sans" x="428" y="1025" font-size="24" fill="#4a4a4a">前提是用户没有明确要求拆分；分类改看使用频率与漏读后果</text>
  <circle cx="408" cy="1058" r="4" fill="#b8b2ab"/>
  <text class="sans" x="428" y="1067" font-size="24" fill="#4a4a4a">验证在关键词检查之外，增加力度、时机与例外的比对</text>

  <!-- Footer -->
  <rect x="72" y="1116" width="1456" height="76" rx="14" fill="#f2efeb"/>
  <text class="sans" x="112" y="1164" font-size="23" fill="#5a5550">改动集中在判断顺序和判断标准上，产品文件里没有新增命令、依赖或服务。</text>
</svg>
