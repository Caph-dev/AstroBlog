name: Host Recon

# 临时只读诊断工作流（第二轮）：确认 Caddy 站点配置与 cloudflared 隧道的接线方式，
# 判断能否用 runner 自动接入新子域。除日志外不做任何改动，确认后删除。
on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: [self-hosted, netcup]
    steps:
      - name: Caddyfile
        run: |
          cd /home/caph/compose/caph-stack || exit 0
          echo "=== Caddyfile ==="
          cat Caddyfile
          echo "=== caddy container network ==="
          docker inspect caph-caddy --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'
          echo "=== apps dir ==="
          ls -la apps 2>/dev/null | head -20

      - name: Cloudflared setup
        run: |
          echo "=== process ==="
          ps -o pid,cmd -C cloudflared 2>/dev/null | sed -E 's/(--token |token=)[^ ]+/\1<redacted>/g' | head -5
          echo "=== config files ==="
          ls -la /etc/cloudflared 2>/dev/null || echo "no /etc/cloudflared"
          for f in /etc/cloudflared/config.yml /etc/cloudflared/config.yaml /home/caph/.cloudflared/config.yml; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              sed -E 's/(token[:=][[:space:]]*).*/\1<redacted>/; s/-[A-Za-z0-9_-]{30,}/-<redacted>/g' "$f" | head -40
            fi
          done
          echo "=== systemd unit ==="
          systemctl cat cloudflared 2>/dev/null | grep -E "ExecStart|Environment" | sed -E 's/(--token |token=)[^ ]+/\1<redacted>/g' | head -5

      - name: Permissions
        run: |
          echo "=== passwordless sudo? ==="
          sudo -n true 2>/dev/null && echo "sudo: yes" || echo "sudo: no"
          echo "=== can write compose dir? ==="
          test -w /home/caph/compose/caph-stack/Caddyfile && echo "Caddyfile: writable" || echo "Caddyfile: not writable"
          test -w /etc/cloudflared 2>/dev/null && echo "/etc/cloudflared: writable" || echo "/etc/cloudflared: not writable"

      - name: Caddy reachability
        run: |
          echo "=== 本机 80 端口响应 ==="
          curl -sS -o /dev/null -w "http://127.0.0.1/ -> %{http_code}\n" -H 'Host: caph.me' http://127.0.0.1/ || true
          curl -skS -o /dev/null -w "https://127.0.0.1/ -> %{http_code}\n" -H 'Host: caph.me' https://127.0.0.1/ || true
