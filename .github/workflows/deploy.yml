name: Deploy Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Prefer the netcup self-hosted runner (labels: self-hosted, netcup).
    # Do not deploy back to Tencent/k3s.
    runs-on: [self-hosted, netcup]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image and update caph-blog on netcup
        run: bash scripts/deploy.sh
