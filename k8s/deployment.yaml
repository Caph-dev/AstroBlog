apiVersion: v1
kind: Namespace
metadata:
  name: caph-blog
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caph-blog
  namespace: caph-blog
  labels:
    app: caph-blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caph-blog
  template:
    metadata:
      labels:
        app: caph-blog
    spec:
      containers:
        - name: caph-blog
          image: caph-blog:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: caph-blog
  namespace: caph-blog
spec:
  selector:
    app: caph-blog
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: caph-blog
  namespace: caph-blog
spec:
  rules:
    - host: caph.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: caph-blog
                port:
                  number: 80
