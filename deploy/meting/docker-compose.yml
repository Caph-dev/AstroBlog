# 自建网易云 Meting API（博客音乐播放器的在线音源）。
# 由 scripts/deploy-meting.sh 在 netcup 主机上通过 runner 启动，独立 compose 项目，
# 不直接对外暴露：Caddy 在 caph.me/meting/ 路径上反代到它。
# 镜像来自 .github/workflows/deploy-meting.yml 对上游的实现构建结果，
# 通过 METING_IMAGE 传入（上游：qijie233/meting-api-enhanced）。
services:
  meting:
    image: ${METING_IMAGE:?METING_IMAGE must be set}
    container_name: caph-meting
    restart: unless-stopped
    environment:
      # 应用默认监听 3000
      PORT: "3000"
      # 回链域名固定为 https：容器在 Caddy/隧道后面，靠请求头猜协议会得到 http，
      # 那样返回的音频地址是 http://，在 https 页面上会被浏览器当混合内容拦掉。
      BASE_URL: "https://caph.me"
      # 公开模式：封禁登录/账号/写入类端点，只保留只读音乐接口
      PUBLIC_MODE: "true"
      # 关闭“自动解灰”（用酷我/咪咕/QQ 等第三方音源替换取不到的歌）。
      # 这样行为可预期：拿不到网易云原曲就明确失败，而不是悄悄换成别家的录音。
      ENABLE_GENERAL_UNBLOCK: "false"
      # 只允许本站页面跨域调用
      CORS_ALLOW_ORIGIN: "https://caph.me"
    networks:
      - caph-net
    ports:
      # 只绑本机回环，供部署脚本做就绪探针；公网入口走 Caddy
      - "127.0.0.1:3002:3000"

networks:
  caph-net:
    external: true
