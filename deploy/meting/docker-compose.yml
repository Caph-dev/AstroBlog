# 自建网易云 Meting API（博客音乐播放器的在线音源）。
# 由 scripts/deploy-meting.sh 在 netcup 主机上通过 runner 启动，独立 compose 项目，
# 不直接对外暴露：Caddy 在 caph.me/meting/ 路径上反代到它。
services:
  meting:
    # 固定 digest，避免 :latest 漂移；升级时由脚本显式改这里。
    image: moefurina/ncm-api@sha256:2fcf4dc49313109a91f6cec99c6b36ebd17e8f1fdc89686121dfd14525937896
    container_name: caph-meting
    restart: unless-stopped
    environment:
      # 应用默认监听 3000
      PORT: "3000"
      # 公开模式：封禁登录/账号/写入类端点，只保留只读音乐接口
      PUBLIC_MODE: "true"
      # 关闭“自动解灰”（用酷我/咪咕/QQ 等第三方音源替换无版权歌）。
      # 关掉的目的是行为可预期：取不到网易云原曲就明确失败，而不是悄悄换成别家的录音。
      ENABLE_GENERAL_UNBLOCK: "false"
    networks:
      - caph-net
    ports:
      # 只绑本机回环，供部署脚本做就绪探针；公网入口走 Caddy
      - "127.0.0.1:3002:3000"

networks:
  caph-net:
    external: true
